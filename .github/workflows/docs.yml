# Build documentation with sibling ifcfactory checkout (matches zensical.toml paths = ["../ifcfactory"]).
# Publish to GitHub Pages on push to main/master.
name: Docs

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BIMFabrikHH_docs
    steps:
      - name: Check out BIMFabrikHH_docs
        uses: actions/checkout@v4
        with:
          path: BIMFabrikHH_docs

      - name: Check out ifcfactory (sibling)
        uses: actions/checkout@v4
        with:
          repository: LGV-BIM-Leitstelle/ifcfactory
          path: ifcfactory

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          python -m pip install "poetry>=2.0"

      - name: Install dependencies
        run: poetry install --with ifcfactory --no-interaction

      - name: Build site
        run: poetry run zensical build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: BIMFabrikHH_docs/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
